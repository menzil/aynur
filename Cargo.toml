[package]
name = "aynur"
version = "0.3.1"
edition = "2024"
authors = ["ruzaji yasin"]
description = "A minimal pm2-like process guardian for local Rust binaries"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/menzil/aynur"
keywords = ["process", "daemon", "pm2", "supervisor", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.86"
clap = { version = "4.5.16", features = ["derive"] }
libc = "0.2.158"
serde = { version = "1.0.208", features = ["derive"] }
serde_json = "1.0.125"

[dev-dependencies]
tempfile = "3.12.0"
